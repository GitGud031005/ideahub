<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room live and keyboard QA</title><style>body{font:14px system-ui;background:#eee}header{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}iframe{display:block;border:1px solid #bbb;background:white}input{width:65px}button{padding:8px}</style><header><label>Width <input id="w" value="390" type="number"></label><label>Height <input id="h" value="844" type="number"></label><button id="resize">Resize</button><button data-kind="child">New child</button><button data-kind="sibling">New sibling</button><button data-kind="nested">New nested reply</button><button data-kind="root">New root</button><button data-kind="other">Other room</button></header><iframe title="Responsive preview" src="/qa-room-preview" width="390" height="844"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#resize').onclick=()=>{frame.width=document.querySelector('#w').value;frame.height=document.querySelector('#h').value};for(const b of document.querySelectorAll('[data-kind]'))b.onclick=()=>frame.contentWindow.postMessage({type:'qa:arrival',kind:b.dataset.kind},location.origin);</script>
