<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Footer responsive QA</title><style>body{font:14px system-ui;background:#eee}header{display:flex;gap:10px;margin-bottom:16px}input{width:70px}iframe{display:block;border:1px solid #aaa;background:#fff}</style><header><label>Width <input id="w" value="390"></label><label>Height <input id="h" value="360"></label><button id="resize">Resize</button></header><iframe title="Footer preview" src="/qa-footer-preview" width="390" height="360"></iframe><script>document.querySelector('#resize').onclick=()=>{const f=document.querySelector('iframe');f.width=document.querySelector('#w').value;f.height=document.querySelector('#h').value}</script>
